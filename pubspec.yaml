name: himma_quran
description: >-
  A Flutter mushaf reader (QPC v4 fonts, tajweed, ten readings, tafsir,
  audio, tasmee') built from quran_library 5.0.1, with smooth page turns
  and lower memory.
version: 1.0.1
repository: https://github.com/khaled-hassan1/himma_quran
issue_tracker: https://github.com/khaled-hassan1/himma_quran/issues
topics:
  - quran
  - mushaf
  - islamic

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  arabic_justified_text: ^1.0.4
  archive: ^4.3.0
  audio_service: ^0.18.19
  connectivity_plus: ^7.3.1
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_scale_kit: ^2.0.2
  flutter_svg: ^2.3.0
  get: ^4.7.3
  get_storage: ^2.1.1
  html: ^0.15.7
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  # media_kit_libs_windows_audio: ^1.0.9  # Commented out for WASM compatibility
  path: ^1.9.1
  path_provider: ^2.1.6
  # تسميع بالذكاء الاصطناعي: تسجيل الميكروفون / AI tasmee: mic recording
  record: ^7.1.1
  rxdart: ^0.28.0
  preload_page_view: ^0.2.0
  # محرك التسميع المحلي (ONNX) — تثبيت مطابق للأصول الأصلية:
  # إصدارات 1.13.x من طبقة Dart تتطلب رموزًا أصلية 1.13 غير موجودة في
  # أصول 1.13.8 (يفشل initBindings)، و1.13 يكسر البثّ على macOS arm64.
  # Dart + natives يجب أن يكونا 1.13.8 معًا.
  sherpa_onnx: 1.13.8
  # تثبيت الأصول الأصلية نفسها (تبعيات مباشرة لا overrides — الـ overrides
  # لا تنتقل من مكتبة إلى تطبيق مستهلك، بينما قيود التبعيات المباشرة تُحترم
  # في حل أي تطبيق يستخدم هذه المكتبة).
  # Pin the native endorsers themselves (regular dependencies, NOT
  # overrides — overrides don't propagate to host apps, but exact
  # dependency constraints do via the version solver).
  sherpa_onnx_ios: 1.13.8
  sherpa_onnx_macos: 1.13.8
  sherpa_onnx_android_arm64: 1.13.8
  sherpa_onnx_android_armeabi: 1.13.8
  sherpa_onnx_android_x86: 1.13.8
  sherpa_onnx_android_x86_64: 1.13.8

  # Its assets (fonts, jsons, images) and its Android plugin registration.
  quran_library: 5.0.1
